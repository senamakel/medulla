[package]
name = "medulla"
description = "Medulla client SDK: backend HTTP/SSE client, runtimes, persona memory, and the coding-agent daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "medulla"
path = "src/lib.rs"

[features]
default = ["workflows", "openhuman-core"]
# The workflow engine and everything built on it. Kept behind a feature so a
# slim build can drop the engine and its jq expression stack; on by default
# because the shipped TUI exposes workflows.
workflows = ["dep:tinyflows"]

# Embed the OpenHuman core. Default-OFF while the migration is in flight: the
# shipped build stays byte-identical, and the ~3x compile cost plus the
# feature-unification hazards (git2's native build, TLS provider selection,
# reqwest feature union) are shaken out behind an explicit opt-in first.
#
# The dependency lives on the SDK rather than the app crate because the SDK
# already owns every vendored-crate seam; a second, unmanaged seam in the app
# crate is what AGENTS.md's "keep engine coupling in the seam" rule forbids.
openhuman-core = ["dep:openhuman"]

[dependencies]
tinyplace = { workspace = true }
tinyflows = { workspace = true, optional = true }
tinycortex = { workspace = true }
# default-features = false is LOAD-BEARING, not tidiness: OpenHuman's defaults
# include its own `tui` gate on ratatui 0.30 / crossterm 0.29 against this
# workspace's 0.29 / 0.28. Those are semver-incompatible at 0.x, so Cargo would
# link BOTH — two raw-mode state machines and two background reader threads on
# one tty fd. That is not a compile error; it is a wrecked terminal.
# `default-features = false` is load-bearing (see below), but an EMPTY feature
# list compiles a core with no Medulla domain at all — `openhuman::medulla` and
# the `embed::Medulla` facade are both behind its `medulla` gate. Without this,
# the embedded core builds fine and simply has nothing this host can call.
openhuman = { workspace = true, optional = true, default-features = false, features = [
    "medulla",
] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }
async-trait = { workspace = true }
agent-client-protocol = { workspace = true }
rust_socketio = { version = "0.6", features = ["async"] }
dirs = { workspace = true }
fs2 = { workspace = true }
regex = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }

tempfile = { workspace = true }

[dev-dependencies]
