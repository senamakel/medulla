name: Release

# One-click release: pick a semver bump (patch, minor, or major) and this
# workflow bumps the shared workspace version in Cargo.toml/Cargo.lock, commits
# `chore(release): vX.Y.Z` to main, pushes a matching annotated tag, builds the
# `medulla` binary for each supported target from that tag, and publishes a
# GitHub Release with the packaged binaries and `latest.json` attached.
#
# Always releases from main, whatever ref it is dispatched on. The bump commit
# and tag go up in one atomic push, so a rejected push (main moved underneath
# the run) leaves neither behind. The release is created in this same workflow,
# so GITHUB_TOKEN pushes not triggering other workflows is fine.

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Semver increment to apply to the current version.
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

concurrency:
  # One release at a time: two concurrent bumps would race for the same tag.
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Bump version and tag (${{ inputs.release_type }})
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Test the bump script
        run: bash scripts/release/test-bump-version.sh

      - name: Bump version
        id: bump
        run: bash scripts/release/bump-version.sh "${{ inputs.release_type }}"

      - name: Ensure tag does not already exist
        env:
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch origin --tags --force
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null ||
            git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            echo "Release tag ${TAG} already exists" >&2
            exit 1
          fi

      - name: Commit, tag, and push
        env:
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          set -euo pipefail
          git add Cargo.toml Cargo.lock
          git commit -m "chore(release): ${TAG}"
          # Annotated tag + explicit ref push: --follow-tags skips lightweight
          # tags, which would leave the build jobs nothing to check out.
          git tag -a "${TAG}" -m "${TAG}"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/${TAG}"

  build:
    needs: prepare
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          submodules: false

      - name: Initialize submodules
        run: bash scripts/init-submodules.sh

      - uses: ./.github/actions/native-deps
        if: runner.os == 'Linux'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: release-${{ matrix.target }}-${{ hashFiles('.gitmodules', 'rust-toolchain.toml') }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          pkg="medulla-${{ needs.prepare.outputs.tag }}-${{ matrix.target }}"
          mkdir "$pkg"
          cp "target/${{ matrix.target }}/release/medulla" "$pkg/"
          cp README.md config.example.toml "$pkg/"
          tar -czf "${pkg}.tar.gz" "$pkg"
          shasum -a 256 "${pkg}.tar.gz" > "${pkg}.tar.gz.sha256"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pkg = "medulla-${{ needs.prepare.outputs.tag }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $pkg | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/medulla.exe" "$pkg/"
          Copy-Item README.md,config.example.toml "$pkg/"
          Compress-Archive -Path $pkg -DestinationPath "$pkg.zip"
          $hash = (Get-FileHash "$pkg.zip" -Algorithm SHA256).Hash.ToLower()
          [System.IO.File]::WriteAllText("$pkg.zip.sha256", "$hash  $pkg.zip`n")

      - uses: actions/upload-artifact@v4
        with:
          name: medulla-${{ matrix.target }}
          path: |
            medulla-*.tar.gz
            medulla-*.tar.gz.sha256
            medulla-*.zip
            medulla-*.zip.sha256
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate latest.json
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import datetime, glob, json, os

          tag = os.environ["TAG"]
          version = os.environ["VERSION"]
          repo = os.environ["REPOSITORY"]
          base = f"https://github.com/{repo}/releases/download/{tag}"
          prefix = f"medulla-{tag}-"
          platforms = {}
          for path in sorted(glob.glob("dist/*.sha256")):
              asset = os.path.basename(path)[:-len(".sha256")]
              digest = open(path, encoding="utf-8").read().split()[0]
              stem = asset
              for ext in (".tar.gz", ".zip"):
                  if stem.endswith(ext):
                      stem = stem[:-len(ext)]
                      break
              triple = stem[len(prefix):]
              platforms[triple] = {"url": f"{base}/{asset}", "sha256": digest}
          manifest = {
              "version": version,
              "tag": tag,
              "pubDate": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "notes": f"https://github.com/{repo}/releases/tag/{tag}",
              "platforms": platforms,
          }
          if len(platforms) != 4:
              raise SystemExit(f"Expected 4 release platforms; found {len(platforms)}")
          with open("dist/latest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
          print(json.dumps(manifest, indent=2))
          PY

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Medulla ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
            dist/latest.json
